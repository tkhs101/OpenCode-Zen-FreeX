# Throwaway probe for the guard walls.yml relies on before merging unattended:
# the pull request must change limits-observed.json and nothing else. Runs
# between two scratch branches and never touches main.
name: guard probe
on:
  push:
    branches: [probe/head2]
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the guard the way the walls workflow checks it
        run: |
          set -uo pipefail
          topic="probe/topic-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$topic"
          printf '\n' >> limits-observed.json
          git add limits-observed.json
          git commit -m "chore: probe the single-file guard"
          git push -u origin "$topic"
          gh pr create --title "probe: the single-file guard" --body "Between two scratch branches." --base probe/base2 --head "$topic"
          paths=$(gh pr view "$topic" --json files --jq '[.files[].path] | join(",")')
          echo "guard saw: [$paths]"
          if [ "$paths" = "limits-observed.json" ]; then echo "GUARD: MERGE"; else echo "GUARD: HOLD"; fi
          gh pr merge "$topic" --squash || echo "merge refused"
          gh pr view "$topic" --json state,mergedAt --jq '"state=\(.state) mergedAt=\(.mergedAt)"'
          git push origin --delete "$topic" >/dev/null 2>&1 && echo "branch deleted"
